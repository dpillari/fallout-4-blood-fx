name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check shaders (fxc)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          python tools/check_shaders.py $fxc.FullName

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        shell: pwsh
        env:
          XSE_FO4_MODS_PATH: ${{ github.workspace }}\out
        run: |
          xmake f -m releasedbg -y
          xmake build -y -v

      - name: Assemble mod folder
        shell: pwsh
        run: |
          $dst = "out\BloodFX\F4SE\Plugins"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem -Recurse build -Include BloodFX.dll, BloodFX.pdb | Copy-Item -Destination $dst -Force
          Copy-Item dist\BloodFX.ini $dst -Force
          Get-ChildItem -Recurse out | Select-Object FullName, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BloodFX
          path: out/BloodFX

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Move-Item out\BloodFX\F4SE\Plugins\BloodFX.pdb BloodFX.pdb
          Compress-Archive -Path out\BloodFX\* -DestinationPath BloodFX.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest BloodFX.zip BloodFX.pdb --title "BloodFX (latest build)" --target ${{ github.sha }} --notes "Automatic build of ${{ github.sha }}. Install BloodFX.zip with a mod manager, or extract it into Fallout 4\Data. Requires F4SE + Address Library for runtime 1.11.240. BloodFX.pdb is only for crash debugging."
