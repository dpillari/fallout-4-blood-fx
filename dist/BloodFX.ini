; Install to: Data/F4SE/Plugins/BloodFX.ini

[General]
bEnabled=1
; extra logging to Documents\My Games\Fallout4\F4SE\BloodFX.log
bDebugLog=0

[Performance]
; Total live drops + splats. Cost is ~linear. Rough guide:
;   2048  = integrated GPUs / Steam Deck
;   4096  = default, any dedicated card
;   16384 = high-end, lots of lingering pools
iMaxParticles=4096
iDropsPerHit=24
iDropsPerKill=64

[Physics]
; game units (1 unit ~ 1.43 cm)
fSpraySpeed=450
fSpread=0.45
fGravity=686
fDrag=0.8
; below this speed a drop sticks instead of bouncing/running
fStickSpeed=120
fBounce=0.05
; how close to a surface counts as "hit" (bigger = fewer drops passing through thin stuff)
fCollideThickness=12

[Look]
fDropSize=0.9
fSplatSize=3.0
; how much a splat spreads over its first 2 seconds (0.6 = grows 60%)
fSplatGrow=0.6
fFlyLife=2.5
fSplatLife=45
fColorR=0.32
fColorG=0.02
fColorB=0.02
fOpacity=0.92

[Filter]
; races with any of these keywords don't bleed
sNoBloodKeywords=ActorTypeRobot,ActorTypeTurret

[Advanced]
; Which engine depth buffer to collide against. -1 = auto (first one matching screen size).
; If blood falls through floors, check BloodFX.log for the list of targets and try another index.
iDepthTarget=-1
